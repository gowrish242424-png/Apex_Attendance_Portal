{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <!-- Header Header -->
            <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);">
                <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
                    <i class="bi bi-shield-lock-fill fs-2 text-warning"></i>
                </div>
                <h4 class="fw-bold mb-1">Apex Attendance Portal</h4>
                <p class="small text-white-50 mb-0">Sign in to access your role dashboard</p>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <!-- Username or Email -->
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username"
                                   placeholder="e.g. admin or fac_sharma" value="{{ username or '' }}" required autofocus>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password"
                                   name="password" placeholder="Enter your password" required>
                            <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label small text-secondary" for="remember">Keep me logged in</label>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-box-arrow-in-right"></i>
                            <span>Sign In</span>
                        </button>
                    </div>
                </form>

                <!-- Quick-Fill Demo Credentials Helper -->
                <div class="border-top pt-3 mt-3">
                    <p class="small text-muted mb-2 text-center fw-semibold">Quick-Fill Demo Credentials:</p>
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center"
                                onclick="fillCredentials('admin', 'admin123')">
                            <span><i class="bi bi-shield-check me-1"></i> Admin</span>
                            <span class="badge bg-primary-subtle text-primary">admin / admin123</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center"
                                onclick="fillCredentials('fac_sharma', 'faculty123')">
                            <span><i class="bi bi-person-workspace me-1"></i> Faculty (Dr. Sharma)</span>
                            <span class="badge bg-success-subtle text-success">fac_sharma / faculty123</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-warning text-start d-flex justify-content-between align-items-center"
                                onclick="fillCredentials('student_aarav', 'student123')">
                            <span><i class="bi bi-mortarboard me-1"></i> Student (Aarav Patel)</span>
                            <span class="badge bg-warning-subtle text-warning-emphasis">student_aarav / student123</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }

    // Quick-fill credentials for demo
    function fillCredentials(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
    }
</script>
{% endblock %}

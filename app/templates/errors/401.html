{% extends 'base.html' %}

{% block title %}401 Unauthorized{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="mb-3">
                <div class="d-inline-flex p-4 rounded-circle bg-secondary-subtle text-secondary mb-2">
                    <i class="bi bi-person-lock display-3"></i>
                </div>
            </div>
            <h1 class="display-6 fw-bold text-dark mb-2">401 Unauthorized</h1>
            <h5 class="text-secondary fw-semibold mb-3">Authentication Required</h5>
            <p class="text-muted small mb-4">
                Access to this resource requires active user authentication. Please sign in with your college credentials to proceed.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Go to Sign In
                </a>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-house me-1"></i> Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
